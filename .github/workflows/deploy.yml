name: Build & Deploy to Symbol Host

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "${{ github.workspace }}/.ssh-deploy-key"
          chmod 600 "${{ github.workspace }}/.ssh-deploy-key"
          PORT="${{ secrets.SSH_PORT }}"
          PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy incrementally via SFTP (no rsync on host)
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_USER: theins20
          DEPLOY_REMOTE_DIR: /home/theins20/financcalculator.ru
          DEPLOY_LOCAL_DIR: dist
          DEPLOY_KEY_PATH: ${{ github.workspace }}/.ssh-deploy-key
          DEPLOY_CONCURRENCY: "8"
        run: node scripts/deploy-incremental.mjs

      - name: Verify indexed URLs live (200)
        run: node scripts/verify-indexed-urls.mjs
