name: Build & Deploy to Symbol Host

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Clear remote folder
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            theins20@${{ secrets.SSH_HOST }} \
            "rm -rf /home/theins20/financcalculator.ru/* /home/theins20/financcalculator.ru/.[!.]*"

      - name: Deploy via scp
        run: |
          scp -r \
            -i ~/.ssh/deploy_key \
            -P ${{ secrets.SSH_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            dist/. \
            theins20@${{ secrets.SSH_HOST }}:/home/theins20/financcalculator.ru/
