<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
  </defs>
  <rect width="900" height="520" rx="24" fill="#fffbeb"/>
  <text x="60" y="85" fill="#9a3412" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">Closing costs add up</text>
  <text x="60" y="125" fill="#c2410c" font-family="Segoe UI,Arial,sans-serif" font-size="20">Plan roughly 2%-5% of price (your Loan Estimate is official)</text>
  <g transform="translate(60 160)">
    <rect width="320" height="100" rx="14" fill="url(#card)" stroke="#fb923c" stroke-width="2"/>
    <text x="24" y="42" fill="#9a3412" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Title and recording</text>
    <text x="24" y="72" fill="#ea580c" font-family="Segoe UI,Arial,sans-serif" font-size="17">Deeds, search, filing fees</text>
    <rect y="120" width="320" height="100" rx="14" fill="url(#card)" stroke="#fb923c" stroke-width="2"/>
    <text x="24" y="162" fill="#9a3412" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Lender fees</text>
    <text x="24" y="192" fill="#ea580c" font-family="Segoe UI,Arial,sans-serif" font-size="17">Origination, points, processing</text>
    <rect y="240" width="320" height="100" rx="14" fill="url(#card)" stroke="#fb923c" stroke-width="2"/>
    <text x="24" y="282" fill="#9a3412" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Prepaids</text>
    <text x="24" y="312" fill="#ea580c" font-family="Segoe UI,Arial,sans-serif" font-size="17">Taxes, insurance, escrow setup</text>
  </g>
  <g transform="translate(460 140)">
    <rect width="380" height="300" rx="20" fill="#fff" stroke="#f97316" stroke-width="3"/>
    <text x="32" y="55" fill="#c2410c" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="800">Cash to close</text>
    <rect x="32" y="80" width="316" height="36" rx="8" fill="#fed7aa"/>
    <text x="48" y="105" fill="#9a3412" font-family="Segoe UI,Arial,sans-serif" font-size="18">Down payment + closing + reserves</text>
    <circle cx="190" cy="200" r="70" fill="#fb923c"/>
    <text x="190" y="195" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Save</text>
    <text x="190" y="222" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">early</text>
  </g>
</svg>