<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Mortgage amortization chart">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B72C4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B72C4" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="24" y="24" width="912" height="492" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="48" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1e293b" font-weight="700">Loan balance over 30 years</text>
  <text x="48" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">$400,000 loan at 6.5%  balance falls slowly at first</text>

  <line x1="80" y1="420" x2="880" y2="420" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="80" y1="120" x2="80" y2="420" stroke="#cbd5e1" stroke-width="2"/>

  <path d="M80,140 C220,380 360,400 520,410 C680,418 780,420 880,422 L880,420 L80,420 Z" fill="url(#area)"/>
  <path d="M80,140 C220,380 360,400 520,410 C680,418 780,420 880,422" fill="none" stroke="#3B72C4" stroke-width="4" stroke-linecap="round"/>

  <circle cx="80" cy="140" r="7" fill="#2B5CA8"/>
  <circle cx="880" cy="422" r="7" fill="#2B5CA8"/>

  <text x="72" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Year 0</text>
  <text x="828" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Year 30</text>
  <text x="48" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">$400k</text>
  <text x="48" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">$0</text>

  <rect x="640" y="140" width="220" height="110" rx="12" fill="#EBF3FF" stroke="#3B72C4" stroke-width="2"/>
  <text x="660" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2B5CA8" font-weight="700">Early payments</text>
  <text x="660" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Mostly interest in years 110</text>
  <text x="660" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Principal gains speed later</text>
</svg>
