<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="1400" height="900" fill="#0b1020"/>
  <rect x="240" y="80" width="920" height="740" rx="30" fill="#111827" stroke="#374151" stroke-width="6"/>
  <text x="700" y="150" text-anchor="middle" fill="#e5e7eb" font-size="42" font-family="Arial, Helvetica, sans-serif" font-weight="700">Terminal Currency Choice</text>
  <text x="700" y="198" text-anchor="middle" fill="#9ca3af" font-size="24" font-family="Arial, Helvetica, sans-serif">Pay in EUR (local) vs DCC to home currency</text>

  <rect x="300" y="250" width="800" height="210" rx="18" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  <text x="340" y="310" fill="#93c5fd" font-size="30" font-family="Arial, Helvetica, sans-serif">Option A: Local Currency (EUR)</text>
  <text x="340" y="355" fill="#e5e7eb" font-size="28" font-family="Arial, Helvetica, sans-serif">Amount: EUR 120.00</text>
  <text x="340" y="400" fill="#86efac" font-size="26" font-family="Arial, Helvetica, sans-serif">Issuer converts at network rate + known fees</text>

  <rect x="300" y="500" width="800" height="250" rx="18" fill="#1f2937" stroke="#475569" stroke-width="4"/>
  <text x="340" y="560" fill="#fca5a5" font-size="30" font-family="Arial, Helvetica, sans-serif">Option B: DCC (Home Currency)</text>
  <text x="340" y="605" fill="#e5e7eb" font-size="28" font-family="Arial, Helvetica, sans-serif">Amount shown: USD 139.20</text>
  <text x="340" y="650" fill="#fde68a" font-size="26" font-family="Arial, Helvetica, sans-serif">Convenient, but implied rate is often weaker</text>
  <text x="340" y="695" fill="#cbd5e1" font-size="24" font-family="Arial, Helvetica, sans-serif">Always compare totals before tapping.</text>
</svg>
