<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Loan amortization schedule chart">
  <defs>
    <linearGradient id="barP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="barI" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="24" y="24" width="912" height="492" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1e293b" font-weight="700">Payment split shifts over time</text>
  <text x="48" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">$20,000 loan at 8% - interest share falls each year</text>
  <g transform="translate(80 140)">
    <rect x="0" y="200" width="70" height="120" fill="url(#barI)" rx="6"/>
    <rect x="0" y="260" width="70" height="60" fill="url(#barP)" rx="6"/>
    <text x="20" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Yr 1</text>
    <rect x="110" y="180" width="70" height="100" fill="url(#barI)" rx="6"/>
    <rect x="110" y="250" width="70" height="70" fill="url(#barP)" rx="6"/>
    <text x="130" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Yr 2</text>
    <rect x="220" y="160" width="70" height="80" fill="url(#barI)" rx="6"/>
    <rect x="220" y="220" width="70" height="100" fill="url(#barP)" rx="6"/>
    <text x="240" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Yr 3</text>
    <rect x="330" y="150" width="70" height="60" fill="url(#barI)" rx="6"/>
    <rect x="330" y="190" width="70" height="130" fill="url(#barP)" rx="6"/>
    <text x="350" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Yr 4</text>
  </g>
  <rect x="560" y="160" width="16" height="16" rx="3" fill="#F472B6"/>
  <text x="584" y="173" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Interest portion</text>
  <rect x="560" y="190" width="16" height="16" rx="3" fill="#10B981"/>
  <text x="584" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Principal portion</text>
  <rect x="560" y="240" width="320" height="100" rx="12" fill="#EBF3FF" stroke="#3B72C4" stroke-width="2"/>
  <text x="580" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2B5CA8" font-weight="700">Early years: mostly interest</text>
  <text x="580" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Later years: mostly principal payoff</text>
</svg>
