<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Myth versus reality when salary crosses a bracket">
  <rect width="1200" height="630" fill="#fffbeb"/>
  <text x="80" y="70" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#92400e">Raise and tax brackets</text>
  <rect x="80" y="110" width="500" height="220" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="110" y="155" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#991b1b">Myth</text>
  <text x="110" y="200" font-family="Arial,sans-serif" font-size="20" fill="#7f1d1d">Entering a higher bracket retaxes</text>
  <text x="110" y="230" font-family="Arial,sans-serif" font-size="20" fill="#7f1d1d">all your income at the new rate</text>
  <rect x="620" y="110" width="500" height="220" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="3"/>
  <text x="650" y="155" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#065f46">Reality</text>
  <text x="650" y="200" font-family="Arial,sans-serif" font-size="20" fill="#064e3b">Lower bands keep their rates;</text>
  <text x="650" y="230" font-family="Arial,sans-serif" font-size="20" fill="#064e3b">only income above the threshold uses the higher rate</text>
  <text x="80" y="400" font-family="Arial,sans-serif" font-size="24" fill="#78350f">A raise still raises take-home pay (all else equal)</text>
</svg>
