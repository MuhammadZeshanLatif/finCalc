<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="NDFL 2026 tax bracket table chart">
  <rect width="960" height="540" fill="#ffffff"/>
  <rect x="24" y="24" width="912" height="492" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1e293b" font-weight="700">NDFL 2026 brackets (main tax base)</text>
  <text x="48" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">Residents - salary and similar income - rubles per year</text>
  <rect x="48" y="120" width="864" height="36" fill="#3B72C4" rx="8"/>
  <text x="64" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700">Annual base interval</text>
  <text x="520" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700">Rate</text>
  <text x="700" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#fff" font-weight="700">Applies to</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">
    <rect x="48" y="164" width="864" height="40" fill="#fff" stroke="#e2e8f0"/>
    <text x="64" y="189">up to 2.4 million rub</text>
    <text x="520" y="189" font-weight="700" fill="#2B5CA8">13%</text>
    <text x="700" y="189">amount in this band only</text>
    <rect x="48" y="204" width="864" height="40" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="64" y="229">2.4M - 5M rub</text>
    <text x="520" y="229" font-weight="700" fill="#2B5CA8">15%</text>
    <text x="700" y="229">rubles inside interval</text>
    <rect x="48" y="244" width="864" height="40" fill="#fff" stroke="#e2e8f0"/>
    <text x="64" y="269">5M - 20M rub</text>
    <text x="520" y="269" font-weight="700" fill="#2B5CA8">18%</text>
    <text x="700" y="269">rubles inside interval</text>
    <rect x="48" y="284" width="864" height="40" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="64" y="309">20M - 50M rub</text>
    <text x="520" y="309" font-weight="700" fill="#2B5CA8">20%</text>
    <text x="700" y="309">rubles inside interval</text>
    <rect x="48" y="324" width="864" height="40" fill="#fff" stroke="#e2e8f0"/>
    <text x="64" y="349">above 50M rub</text>
    <text x="520" y="349" font-weight="700" fill="#2B5CA8">22%</text>
    <text x="700" y="349">amount above 50M only</text>
  </g>
  <rect x="48" y="390" width="864" height="90" rx="12" fill="#EBF3FF" stroke="#3B72C4" stroke-width="2"/>
  <text x="68" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2B5CA8" font-weight="700">Marginal vs average</text>
  <text x="68" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Crossing 2.4M rub does not tax your entire salary at 15% - only rubles above the threshold.</text>
</svg>
