<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Three buckets liquidity safety and growth">
  <rect width="1200" height="630" fill="#f1f5f9"/>
  <text x="80" y="80" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0f172a">Order of priority</text>
  <rect x="80" y="130" width="320" height="400" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="4"/>
  <text x="140" y="200" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#14532d">1. Liquidity</text>
  <text x="110" y="260" font-family="Arial,sans-serif" font-size="22" fill="#166534">Same-day or next-day access</text>
  <rect x="440" y="130" width="320" height="400" rx="16" fill="#fef9c3" stroke="#eab308" stroke-width="4"/>
  <text x="500" y="200" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#713f12">2. Safety</text>
  <text x="470" y="260" font-family="Arial,sans-serif" font-size="22" fill="#854d0e">Principal you cannot afford to lose</text>
  <rect x="800" y="130" width="320" height="400" rx="16" fill="#e0e7ff" stroke="#6366f1" stroke-width="4"/>
  <text x="880" y="200" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#312e81">3. Yield</text>
  <text x="830" y="260" font-family="Arial,sans-serif" font-size="22" fill="#3730a3">Only after 1 and 2 are solid</text>
</svg>
