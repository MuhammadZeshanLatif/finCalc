<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Simplified tax bands for calculator demo">
  <rect width="1200" height="630" fill="#f1f5f9"/>
  <text x="80" y="75" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">FinCalc tax tool (demo bands)</text>
  <text x="80" y="115" font-family="Arial,sans-serif" font-size="20" fill="#64748b">Educational stairstep only - not IRS tables or filing advice</text>
  <rect x="120" y="180" width="960" height="64" rx="8" fill="#e2e8f0"/>
  <text x="140" y="220" font-family="Arial,sans-serif" font-size="22" fill="#334155">Slice 1: taxed at rate R1</text>
  <rect x="120" y="260" width="960" height="64" rx="8" fill="#cbd5e1"/>
  <text x="140" y="300" font-family="Arial,sans-serif" font-size="22" fill="#334155">Slice 2: taxed at rate R2</text>
  <rect x="120" y="340" width="960" height="64" rx="8" fill="#94a3b8"/>
  <text x="140" y="380" font-family="Arial,sans-serif" font-size="22" fill="#1e293b">Slice 3: taxed at rate R3</text>
  <text x="80" y="500" font-family="Arial,sans-serif" font-size="22" fill="#475569">Total tax = sum of (slice times rate)</text>
</svg>
