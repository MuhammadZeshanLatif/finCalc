<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Marginal rate versus effective average rate">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <text x="80" y="80" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Marginal vs effective rate</text>
  <rect x="80" y="130" width="480" height="200" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="110" y="185" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#1e40af">Marginal</text>
  <text x="110" y="230" font-family="Arial,sans-serif" font-size="22" fill="#1e3a8a">Tax on the next $1 of income</text>
  <text x="110" y="285" font-family="Arial,sans-serif" font-size="20" fill="#334155">Drives marginal decisions (overtime, side gig)</text>
  <rect x="600" y="130" width="480" height="200" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="630" y="185" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#14532d">Effective (average)</text>
  <text x="630" y="230" font-family="Arial,sans-serif" font-size="22" fill="#166534">Total tax divided by total income</text>
  <text x="630" y="285" font-family="Arial,sans-serif" font-size="20" fill="#334155">Usually below your top bracket rate</text>
</svg>
