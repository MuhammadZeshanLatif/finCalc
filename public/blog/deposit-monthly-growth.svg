  <text x="535" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1e293b" font-weight="700">$13,558</text>
  <rect x="700" y="140" width="16" height="16" rx="3" fill="#10B981"/>
  <text x="724" y="153" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Contributions</text>
