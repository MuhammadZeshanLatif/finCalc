  <text x="335" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1e293b" font-weight="700">$10,562</text>
  <rect x="520" y="190" width="120" height="210" fill="#10B981" opacity="0.85" rx="8"/>
