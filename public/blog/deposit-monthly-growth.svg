  <text x="135" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Year 1</text>
  <text x="135" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1e293b" font-weight="700">$7,712</text>
  <rect x="320" y="260" width="120" height="140" fill="#10B981" opacity="0.85" rx="8"/>
