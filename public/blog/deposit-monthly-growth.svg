  <text x="48" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">$5,000 + $200/mo at 5% - interest on a growing base</text>
  <line x1="80" y1="400" x2="860" y2="400" stroke="#cbd5e1" stroke-width="2"/>
