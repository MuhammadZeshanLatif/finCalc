<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="BMI calculator chart">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FF"/>
      <stop offset="100%" stop-color="#3B72C4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="120" y="120" width="520" height="380" rx="20" fill="#fff" stroke="#2B5CA8" stroke-width="3"/>
  <text x="150" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#2B5CA8" font-weight="700">BMI zones</text>
  <rect x="150" y="200" width="460" height="40" fill="#3B82F6" rx="6"/>
  <rect x="150" y="250" width="460" height="40" fill="#10B981" rx="6"/>
  <rect x="150" y="300" width="460" height="40" fill="#F59E0B" rx="6"/>
  <rect x="150" y="350" width="460" height="40" fill="#EF4444" rx="6"/>
  <text x="170" y="226" fill="#fff" font-size="14">&lt;18.5 Underweight</text>
  <text x="170" y="276" fill="#fff" font-size="14">18.5-24.9 Normal</text>
  <text x="170" y="326" fill="#fff" font-size="14">25-29.9 Overweight</text>
  <text x="170" y="376" fill="#fff" font-size="14">30+ Obese</text>
  <text x="150" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1e293b" font-weight="700">BMI = weight / height^2</text>
  <text x="680" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#fff" font-weight="700">BMI Calculator</text>
</svg>
