<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="BMI categories chart">
  <rect width="960" height="540" fill="#fff"/>
  <rect x="24" y="24" width="912" height="492" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1e293b" font-weight="700">BMI categories and risk bands</text>
  <rect x="80" y="120" width="120" height="280" fill="#3B82F6" opacity="0.7" rx="8"/>
  <rect x="220" y="180" width="120" height="220" fill="#10B981" opacity="0.8" rx="8"/>
  <rect x="360" y="140" width="120" height="260" fill="#F59E0B" opacity="0.8" rx="8"/>
  <rect x="500" y="100" width="120" height="300" fill="#EF4444" opacity="0.75" rx="8"/>
  <text x="95" y="420" font-size="12" fill="#64748b">Under</text>
  <text x="245" y="420" font-size="12" fill="#64748b">Normal</text>
  <text x="385" y="420" font-size="12" fill="#64748b">Over</text>
  <text x="530" y="420" font-size="12" fill="#64748b">Obese</text>
  <text x="680" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Screening signal - not full health picture</text>
</svg>
