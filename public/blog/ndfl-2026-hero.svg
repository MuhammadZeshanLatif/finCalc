<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="NDFL 2026 progressive tax calculator">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FF"/>
      <stop offset="55%" stop-color="#3B72C4"/>
      <stop offset="100%" stop-color="#2B5CA8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e3a5f" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="80" fill="#ffffff" opacity="0.1"/>
  <g transform="translate(100 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="470" rx="24" fill="#ffffff" stroke="#2B5CA8" stroke-width="3"/>
    <text x="28" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#2B5CA8" font-weight="700">NDFL 2026 calculator</text>
    <text x="28" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Annual income (gross)</text>
    <rect x="28" y="88" width="424" height="44" rx="10" fill="#EBF3FF" stroke="#3B72C4" stroke-width="2"/>
    <text x="48" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1e293b" font-weight="700">4 500 000 rub</text>
    <rect x="28" y="160" width="424" height="140" rx="14" fill="#f8fafc"/>
    <text x="48" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Tax by bracket</text>
    <rect x="48" y="206" width="180" height="22" rx="6" fill="#3B72C4" opacity="0.25"/>
    <text x="48" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">13% on 2.4M = 312 000 rub</text>
    <rect x="48" y="236" width="220" height="22" rx="6" fill="#3B72C4" opacity="0.45"/>
    <text x="48" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">15% on 2.1M = 315 000 rub</text>
    <rect x="28" y="320" width="424" height="120" rx="14" fill="#3B72C4"/>
    <text x="48" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#EBF3FF">Total NDFL 2026</text>
    <text x="48" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="36" fill="#ffffff" font-weight="700">627 000 rub</text>
    <text x="260" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#EBF3FF">Effective 13.93%</text>
  </g>
  <g transform="translate(640 120)">
    <text x="0" y="0" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="600">Progressive brackets</text>
    <rect x="0" y="24" width="120" height="48" fill="#10B981" rx="8"/>
    <text x="12" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#fff" font-weight="700">13%</text>
    <rect x="130" y="12" width="100" height="60" fill="#3B72C4" rx="8"/>
    <text x="142" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#fff" font-weight="700">15%</text>
    <rect x="240" y="0" width="90" height="72" fill="#6366F1" rx="8"/>
    <text x="252" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#fff" font-weight="700">18%</text>
    <rect x="340" y="-12" width="80" height="84" fill="#8B5CF6" rx="8"/>
    <text x="352" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#fff" font-weight="700">20%</text>
    <rect x="430" y="-24" width="70" height="96" fill="#A855F7" rx="8"/>
    <text x="442" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#fff" font-weight="700">22%</text>
    <text x="0" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#EBF3FF">Only income inside each band taxed at that rate</text>
  </g>
  <text x="640" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#ffffff" font-weight="700">NDFL 2026 Calculator</text>
  <text x="640" y="558" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#EBF3FF">Russia salary tax - marginal and effective rate</text>
</svg>
