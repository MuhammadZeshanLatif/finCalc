<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <rect width="900" height="480" rx="24" fill="#f0f4ff"/>
  <text x="48" y="58" fill="#312e81" font-family="Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">Your real monthly housing stack</text>
  <text x="48" y="95" fill="#4338ca" font-family="Segoe UI,Arial,sans-serif" font-size="18">Principal and interest are only the start - budget the rest.</text>
  <g transform="translate(48 140)">
    <rect width="804" height="64" rx="12" fill="#e0e7ff"/>
    <rect width="200" height="64" rx="12" fill="#4f46e5"/>
    <text x="100" y="42" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">P</text>
    <rect x="208" width="200" height="64" rx="12" fill="#6366f1"/>
    <text x="308" y="42" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">I</text>
    <rect x="416" width="180" height="64" rx="12" fill="#818cf8"/>
    <text x="506" y="42" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">T</text>
    <rect x="604" width="200" height="64" rx="12" fill="#a5b4fc"/>
    <text x="704" y="42" text-anchor="middle" fill="#1e1b4b" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">I</text>
  </g>
  <g transform="translate(48 240)" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#3730a3">
    <text x="0" y="0"><tspan font-weight="700">Principal</tspan> - pays down the loan</text>
    <text x="0" y="32"><tspan font-weight="700">Interest</tspan> - cost of borrowing</text>
    <text x="0" y="64"><tspan font-weight="700">Taxes</tspan> - property tax (often escrowed)</text>
    <text x="0" y="96"><tspan font-weight="700">Insurance</tspan> - hazard + maybe flood/wind</text>
  </g>
  <rect x="48" y="400" width="804" height="56" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="72" y="436" fill="#92400e" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">+ HOA, maintenance, utilities (not in PITI)</text>
</svg>