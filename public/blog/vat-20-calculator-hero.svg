<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="VAT 20 percent calculator">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FF"/>
      <stop offset="55%" stop-color="#3B72C4"/>
      <stop offset="100%" stop-color="#2B5CA8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a5f" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(100 85)" filter="url(#shadow)">
    <rect x="0" y="0" width="480" height="460" rx="24" fill="#ffffff" stroke="#2B5CA8" stroke-width="3"/>
    <text x="28" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#2B5CA8" font-weight="700">VAT calculator - 20%</text>
    <text x="28" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Mode</text>
    <rect x="28" y="92" width="200" height="36" rx="8" fill="#3B72C4"/>
    <text x="48" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#fff" font-weight="600">Inclusive (gross)</text>
    <rect x="240" y="92" width="200" height="36" rx="8" fill="#f1f5f9"/>
    <text x="260" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">Exclusive (net)</text>
    <text x="28" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Amount</text>
    <rect x="28" y="172" width="412" height="44" rx="10" fill="#EBF3FF" stroke="#3B72C4" stroke-width="2"/>
    <text x="48" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1e293b" font-weight="700">120.00</text>
    <rect x="28" y="240" width="412" height="180" rx="14" fill="#f8fafc"/>
    <text x="48" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Net (ex VAT)</text>
    <text x="48" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#10B981" font-weight="700">100.00</text>
    <text x="48" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">VAT 20%</text>
    <text x="48" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#F59E0B" font-weight="700">20.00</text>
    <text x="260" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Gross total</text>
    <text x="260" y="376" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#2B5CA8" font-weight="700">120.00</text>
  </g>
  <g transform="translate(640 150)">
    <rect x="0" y="0" width="420" height="280" rx="20" fill="#ffffff" opacity="0.95" stroke="#2B5CA8" stroke-width="3"/>
    <text x="24" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569" font-weight="600">120 / 1.20 = 100 net</text>
    <circle cx="80" cy="120" r="50" fill="#10B981" opacity="0.2"/>
    <text x="58" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#059669" font-weight="700">83%</text>
    <text x="48" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">net share</text>
    <circle cx="200" cy="120" r="50" fill="#F59E0B" opacity="0.25"/>
    <text x="186" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#d97706" font-weight="700">17%</text>
    <text x="168" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">VAT share</text>
    <text x="24" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Do not subtract 20% of gross - divide by 1.20</text>
  </g>
  <text x="640" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#ffffff" font-weight="700">VAT 20% Calculator</text>
  <text x="640" y="558" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#EBF3FF">Net - tax - gross - invoices</text>
</svg>
