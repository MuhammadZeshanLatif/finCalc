  <rect x="250" y="180" width="900" height="110" rx="14" fill="#1e3a8a"/>
  <text x="300" y="250" fill="#dbeafe" font-size="30" font-family="Arial, Helvetica, sans-serif">Base cash needed (local currency)</text>

  <rect x="250" y="320" width="900" height="90" rx="14" fill="#1d4ed8"/>
  <text x="300" y="377" fill="#dbeafe" font-size="28" font-family="Arial, Helvetica, sans-serif">+ ATM owner surcharge</text>

