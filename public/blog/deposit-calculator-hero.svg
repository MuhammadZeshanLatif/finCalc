<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Deposit calculator illustration">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FF"/>
      <stop offset="50%" stop-color="#3B72C4"/>
      <stop offset="100%" stop-color="#2B5CA8"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a5f" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="160" cy="520" r="100" fill="#ffffff" opacity="0.1"/>
  <circle cx="1020" cy="110" r="70" fill="#ffffff" opacity="0.12"/>

  <g transform="translate(110 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="460" height="450" rx="24" fill="url(#card)" stroke="#2B5CA8" stroke-width="3"/>
    <text x="28" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#2B5CA8" font-weight="700">Deposit calculator</text>

    <text x="28" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Initial deposit</text>
    <rect x="28" y="102" width="404" height="40" rx="10" fill="#EBF3FF" stroke="#3B72C4" stroke-width="2"/>
    <text x="48" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1e293b" font-weight="600">$5,000</text>

    <text x="28" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Monthly contribution</text>
    <rect x="28" y="182" width="404" height="40" rx="10" fill="#f1f5f9"/>
    <text x="48" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2B5CA8" font-weight="700">$200</text>

    <text x="28" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Annual rate (APY)</text>
    <rect x="28" y="262" width="190" height="40" rx="10" fill="#f1f5f9"/>
    <text x="48" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2B5CA8" font-weight="700">5.0%</text>

    <text x="242" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Term</text>
    <rect x="242" y="262" width="190" height="40" rx="10" fill="#f1f5f9"/>
    <text x="262" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#2B5CA8" font-weight="700">3 years</text>

    <rect x="28" y="330" width="404" height="96" rx="14" fill="#3B72C4"/>
    <text x="48" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#EBF3FF">Projected balance</text>
    <text x="48" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#ffffff" font-weight="700">$13,558</text>
    <text x="250" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#EBF3FF">Interest earned $1,358</text>
  </g>

  <g transform="translate(620 130)">
    <rect x="0" y="0" width="460" height="300" rx="20" fill="#ffffff" opacity="0.95" stroke="#2B5CA8" stroke-width="3"/>
    <text x="24" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569" font-weight="600">Savings growth curve</text>
    <line x1="40" y1="250" x2="420" y2="250" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="40" y1="70" x2="40" y2="250" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M40,240 C120,220 180,180 260,130 C320,95 380,75 420,60" fill="none" stroke="#3B72C4" stroke-width="4" stroke-linecap="round"/>
    <path d="M40,240 C120,220 180,180 260,130 C320,95 380,75 420,60 L420,250 L40,250 Z" fill="#3B72C4" opacity="0.12"/>
    <text x="36" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Year 0</text>
    <text x="372" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Year 3</text>
  </g>

  <text x="620" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#ffffff" font-weight="700">Deposit Calculator</text>
  <text x="620" y="538" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#EBF3FF">Project savings with contributions &amp; interest</text>
</svg>
