<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Loan EMI total cost by rate and term">
  <rect width="960" height="540" fill="#fff"/>
  <rect x="24" y="24" width="912" height="492" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1e293b" font-weight="700">Total repayment vs rate and term</text>
  <text x="48" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">$100k loan - longer term and higher rate raise total cost</text>
  <rect x="100" y="380" width="80" height="80" fill="#3B72C4" rx="6"/>
  <rect x="220" y="320" width="80" height="140" fill="#6366F1" rx="6"/>
  <rect x="340" y="260" width="80" height="200" fill="#8B5CF6" rx="6"/>
  <rect x="460" y="340" width="80" height="120" fill="#3B72C4" opacity="0.6" rx="6"/>
  <rect x="580" y="280" width="80" height="180" fill="#6366F1" opacity="0.7" rx="6"/>
  <rect x="700" y="220" width="80" height="240" fill="#EF4444" opacity="0.7" rx="6"/>
  <text x="100" y="480" font-size="11" fill="#64748b">5yr 6%</text>
  <text x="220" y="480" font-size="11" fill="#64748b">10yr 6%</text>
  <text x="340" y="480" font-size="11" fill="#64748b">30yr 6%</text>
  <text x="460" y="480" font-size="11" fill="#64748b">5yr 9%</text>
  <text x="580" y="480" font-size="11" fill="#64748b">10yr 9%</text>
  <text x="700" y="480" font-size="11" fill="#64748b">30yr 9%</text>
</svg>
